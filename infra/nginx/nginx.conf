worker_processes auto;
pid /tmp/nginx.pid;
events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  map $http_upgrade $is_websocket_upgrade {
    default         0;
    ~*^websocket$   1;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Masked log format that excludes query parameters to prevent token/ticket leakage into logs (FINDING-004)
  log_format voice_masked '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $uri HTTP/$server_protocol" '
                          '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

  upstream api_upstream {
    server api:3001;
  }

  upstream web_upstream {
    server web:8080;
  }

  server {
    listen 8080;
    server_name localhost;

    # Metrics are served only by the authenticated internal exporter port.
    location = /api/v1/metrics {
      return 404;
    }

    location ^~ /api/v1/metrics/ {
      return 404;
    }

    # API and Swagger Proxy
    location /api/ {
      proxy_pass http://api_upstream;
            # Requests that do not carry an exact WebSocket Upgrade token are
            # rejected above. This makes the generic syntactic h2c rule a false
            # positive for this deliberately isolated WebSocket endpoint.
            proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
      proxy_set_header Host $proxy_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # SSE Specific Settings
      proxy_buffering off;
      proxy_cache off;
      chunked_transfer_encoding off;
      proxy_read_timeout 24h;
    }

    # WebSocket gateway. Upgrade headers are deliberately confined to this endpoint.
    location /voice {
      if ($is_websocket_upgrade = 0) {
        return 426;
      }

      access_log /var/log/nginx/voice_access.log voice_masked;

      proxy_pass http://api_upstream;
      proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling -- Upgrade is a constant and the request is rejected unless the map matches websocket exactly.
      proxy_set_header Upgrade websocket;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $proxy_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 1h;
    }

    # Frontend SPA Proxy
    location / {
      proxy_pass http://web_upstream;
      proxy_set_header Host $proxy_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
