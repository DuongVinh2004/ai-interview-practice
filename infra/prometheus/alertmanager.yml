global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'slack-default'
  routes:
    - match:
        severity: critical
      receiver: 'pagerduty-and-slack-critical'
      repeat_interval: 1h

    - match:
        tier: cost
      receiver: 'slack-budget-alerts'
      repeat_interval: 2h

    - match:
        severity: warning
      receiver: 'slack-warning'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']

receivers:
  - name: 'pagerduty-and-slack-critical'
    pagerduty_configs:
      - service_key_file: '/etc/alertmanager/secrets/pagerduty_key'
        severity: 'critical'
        send_resolved: true
    slack_configs:
      - channel: '#alerts-critical'
        api_url_file: '/etc/alertmanager/secrets/slack_webhook_url'
        send_resolved: true
        title: 'CRITICAL: {{ .GroupLabels.alertname }} ({{ .Status | toUpper }})'
        text: >-
          {{ range .Alerts }}
            *Alert:* {{ .Annotations.summary }}
            *Description:* {{ .Annotations.description }}
            *Runbook:* <{{ .Annotations.runbook }}|View Runbook>
            *Details:*
            {{ range .Labels.SortedPairs }} • *{{ .Name }}:* `{{ .Value }}`
            {{ end }}
          {{ end }}

  - name: 'slack-warning'
    slack_configs:
      - channel: '#alerts-warning'
        api_url_file: '/etc/alertmanager/secrets/slack_webhook_url'
        send_resolved: true
        title: 'WARNING: {{ .GroupLabels.alertname }} ({{ .Status | toUpper }})'
        text: >-
          {{ range .Alerts }}
            *Alert:* {{ .Annotations.summary }}
            *Description:* {{ .Annotations.description }}
            *Runbook:* <{{ .Annotations.runbook }}|View Runbook>
          {{ end }}

  - name: 'slack-budget-alerts'
    slack_configs:
      - channel: '#alerts-budget'
        api_url_file: '/etc/alertmanager/secrets/slack_webhook_url'
        send_resolved: true
        title: 'BUDGET ALERT: {{ .GroupLabels.alertname }} ({{ .Status | toUpper }})'
        text: >-
          {{ range .Alerts }}
            *Alert:* {{ .Annotations.summary }}
            *Description:* {{ .Annotations.description }}
            *Runbook:* <{{ .Annotations.runbook }}|View Runbook>
          {{ end }}

  - name: 'slack-default'
    slack_configs:
      - channel: '#alerts-general'
        api_url_file: '/etc/alertmanager/secrets/slack_webhook_url'
        send_resolved: true
