version: 2
updates:
  # Maintain dependencies for pnpm monorepo
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 10
    groups:
      dependencies:
        patterns:
          - '*'

  # Maintain GitHub Actions dependencies
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7

  # Maintain Docker dependencies
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
