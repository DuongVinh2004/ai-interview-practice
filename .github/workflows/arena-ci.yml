name: Arena Challenge Validation

'on':
  push:
    paths:
      - 'challenges/**'
      - 'infra/scripts/arena-validate.mjs'
      - 'apps/api/src/modules/engineering-arena/**'
  pull_request:
    paths:
      - 'challenges/**'
      - 'infra/scripts/arena-validate.mjs'
      - 'apps/api/src/modules/engineering-arena/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-arena:
    name: Validate Arena Challenges & Production Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.13.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.0.9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "${GITHUB_ENV}"

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Arena Challenge Validation
        run: node infra/scripts/arena-validate.mjs --dir ./challenges/

      - name: Run Arena & Storage Tests
        run: pnpm --filter @ai-interview/api test -- arena storage

      - name: Build API
        run: pnpm --filter @ai-interview/api run build
