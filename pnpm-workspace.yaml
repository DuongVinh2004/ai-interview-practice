packages:
  - 'apps/*'
  - 'packages/*'
overrides:
  deepmerge-ts: '8.0.2'
  tar: '7.5.22'
  qs: '6.16.0'
  fast-uri: '3.1.6'
  mysql2: '3.23.1'
  multer: '2.4.0'
  proxy-addr: '2.0.8'
  compression: '1.8.2'
  brace-expansion@1: '1.1.21'
  brace-expansion@5: '5.0.12'
  js-yaml@4: '4.3.2'
  js-yaml@5: '5.4.3'
  argparse: '2.0.1'
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - qs
  - fast-uri
  - mysql2
  - multer
  - proxy-addr
  - compression
  - brace-expansion
  - js-yaml
  - argparse
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200
blockExoticSubdeps: true
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  bcrypt: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true
