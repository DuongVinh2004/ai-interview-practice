services:
  postgres:
    image: postgres:16.4-alpine3.20
    container_name: ai_interview_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ai_interview_practice}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_interview_practice}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  redis:
    image: redis:7.4.1-alpine3.20
    container_name: ai_interview_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--requirepass',
        '${REDIS_PASSWORD:?REDIS_PASSWORD is required}',
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  api:
    image: ${API_IMAGE:?API_IMAGE must be an immutable digest reference}
    container_name: ai_interview_api
    restart: unless-stopped
    environment:
      # This stack is intentionally local-only. Production runs on private ECS
      # tasks and rejects this localhost database / non-TLS Redis topology.
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      PROCESS_ROLE: api
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_interview_practice}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AI_PROVIDER: ${AI_PROVIDER:-router}
      AI_BUDGET_DAILY_USD: ${AI_BUDGET_DAILY_USD:?AI_BUDGET_DAILY_USD is required}
      AI_MAX_PROVIDER_CALL_COST_USD: ${AI_MAX_PROVIDER_CALL_COST_USD:?AI_MAX_PROVIDER_CALL_COST_USD is required}
      AI_ALLOW_MOCK: ${AI_ALLOW_MOCK:-false}
      ALLOW_MOCK_PROVIDERS: ${ALLOW_MOCK_PROVIDERS:-false}
      METRICS_EXPORTER_ENABLED: ${METRICS_EXPORTER_ENABLED:-false}
      METRICS_EXPORTER_HOST: 0.0.0.0
      METRICS_EXPORTER_PORT: 9091
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
      CERTIFICATE_SECRET: ${CERTIFICATE_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

  worker:
    image: ${API_IMAGE:?API_IMAGE must be an immutable digest reference}
    container_name: ai_interview_worker
    restart: unless-stopped
    command: ['node', 'apps/api/dist/worker.js']
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PROCESS_ROLE: worker
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_interview_practice}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AI_PROVIDER: ${AI_PROVIDER:-router}
      AI_BUDGET_DAILY_USD: ${AI_BUDGET_DAILY_USD:?AI_BUDGET_DAILY_USD is required}
      AI_MAX_PROVIDER_CALL_COST_USD: ${AI_MAX_PROVIDER_CALL_COST_USD:?AI_MAX_PROVIDER_CALL_COST_USD is required}
      AI_ALLOW_MOCK: ${AI_ALLOW_MOCK:-false}
      ALLOW_MOCK_PROVIDERS: ${ALLOW_MOCK_PROVIDERS:-false}
      METRICS_EXPORTER_ENABLED: ${METRICS_EXPORTER_ENABLED:-false}
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
      CERTIFICATE_SECRET: ${CERTIFICATE_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE must be an immutable digest reference}
    container_name: ai_interview_web
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - app_network

  nginx:
    image: ${NGINX_IMAGE:?NGINX_IMAGE must be an immutable digest reference}
    container_name: ai_interview_nginx
    restart: unless-stopped
    ports:
      - '80:8080'
    depends_on:
      - api
      - web
    networks:
      - app_network

volumes:
  postgres_data:
  redis_data:

networks:
  app_network:
    driver: bridge
